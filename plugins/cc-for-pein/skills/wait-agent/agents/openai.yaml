interface:
  display_name: "CC Wait Agent"
  short_description: "Experimental: sparsely join Agent completion"
  default_prompt: "Experimental: use $cc-for-pein:wait-agent and invoke mcp__cc_for_pein__wait_agent only for a blocked critical-path current-root Agent join; never fall back to shell. Do meaningful non-overlapping work after spawn, then use the fixed one-hour completion-first wait. Set wake_on_progress only for one intentional intermediate observation per Agent turn, then do useful work, steer, or return to completion-first waiting; never repeat progress waiting by reflex. After a quiet timeout, call wait_agent again directly without narration or a list_agents/read_agent_messages probe. Synthesize required completion before final because waiting cannot reactivate an idle Codex parent."
