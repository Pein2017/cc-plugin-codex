interface:
  display_name: "CC Spawn Agent"
  short_description: "Experimental: start an asynchronous durable Agent on one stated route"
  default_prompt: "Experimental: use $codex-harnessdock:spawn-agent and invoke mcp__codex_harnessdock__spawn_agent with a self-contained message and the whole route stated: harness, full model, topology, and write authority. Nothing is defaulted or inferred; $codex-harnessdock:list-harnesses reports what is admitted. Use topology native_orchestrator only with exact Opus or Fable as an experimental Native Agent Team lead, whose transport requires an asynchronously launched named member plus a successful correlated SendMessage to that current-team name; definition models are requested only and teammate effective model, effort, and cost stay unknown without native facts. The opencode Explorer is Experimental, leaf-only, read-only, takes no reasoning effort, and supports neither interruption nor history. Never fall back to a shell command, and remember that completion cannot reactivate an idle Codex parent."
